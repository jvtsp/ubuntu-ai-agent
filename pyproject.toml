[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-agent"
version = "0.2.0"
description = "Assistente de desktop que traduz linguagem natural em comandos Bash seguros para Ubuntu"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Ubuntu Agent Contributors"},
]
keywords = ["ubuntu", "linux", "ai", "llm", "bash", "assistant", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

dependencies = [
    "customtkinter==5.2.2",
    "langchain-openai==0.3.12",
    "langgraph==0.4.1",
    "langchain-core==0.3.51",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "keyboard==0.13.5",
    "pystray==0.19.5",
    "pillow==10.3.0",
    "dbus-next>=0.2.3",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
]

[project.scripts]
ubuntu-agent = "main:main"

[project.urls]
Repository = "https://github.com/seu-usuario/IA_agentica_ubuntu"
Issues = "https://github.com/seu-usuario/IA_agentica_ubuntu/issues"

# ─── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "S603",  # subprocess-without-shell-check — we handle this explicitly
    "S607",  # start-process-with-partial-path
    "T201",  # print — used intentionally in main.py for startup messages
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # allow assert and hardcoded passwords in tests

# ─── Mypy ────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual adoption
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ─── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests that need external services",
]

# ─── Coverage ────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["src"]
omit = [
    "src/ui/*",        # UI components are hard to unit test
    "src/__init__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]
